<section id="sec-estandarizacion" class="space-y-6 animate-fade-in">
    <!-- Encabezado: selector de parámetro -->
    <div class="bg-white p-4 rounded-lg border border-slate-300 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-bold text-slate-800">Estandarización de Soluciones</h2>
            <p class="text-xs text-slate-500">Agrega estandarizaciones gradualmente para tus soluciones.</p>
        </div>
        <div class="flex items-center gap-2">
            <label class="font-semibold text-sm text-slate-700">Parámetro:</label>
            <select id="selectParametroEst" onchange="window.cambiarParametroEstandarizacion(this.value)"
                class="border border-slate-300 px-4 py-2 rounded font-bold text-blue-700 bg-slate-50 outline-none cursor-pointer"></select>
            <button onclick="window.abrirModalParametroEst()" title="Agregar / administrar parámetros"
                class="w-9 h-9 flex items-center justify-center rounded border border-slate-300 text-slate-500 hover:bg-slate-50 text-lg leading-none font-bold">+</button>
        </div>
    </div>

    <!-- Contenedor de Tabs Dinámicos -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2" id="contenedorTabsEst">
        <!-- Las pestañas se inyectan desde JS -->
        <button onclick="window.agregarPestanaEst()" class="px-4 py-2 text-sm font-bold rounded-lg shadow-sm bg-emerald-100 text-emerald-700 hover:bg-emerald-200 transition border border-emerald-300 whitespace-nowrap">+ Nueva Solución</button>
    </div>

    <!-- Contenedor Principal de la Tabla de Estandarización Activa -->
    <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-300 overflow-x-auto hidden" id="vistaEstandarizacionActiva">
        
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-slate-800 text-base" id="tituloPestanaActiva">Estandarizaciones</h3>
            <button onclick="window.agregarBloqueEstandarizacion()" id="btnAgregarBloqueEst" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-bold hover:bg-blue-700 transition shadow-sm">
                + Agregar Estandarización
            </button>
        </div>

        <div id="listaEstandarizaciones" class="space-y-6">
            <!-- Las tablas con el formato de la imagen se inyectan aquí -->
        </div>
    </div>
</section>
